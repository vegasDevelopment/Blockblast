<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap');
:root{
  --bg:#0b0b14;--surface:#12121e;--accent:#00e5ff;--accent2:#ff2d6b;
  --gold:#ffd000;--green:#06d6a0;--cell:#161628;--cs:36px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Rajdhani',sans-serif;color:#fff;user-select:none;}
#gameScreen{touch-action:none;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;will-change:opacity,transform;transition:opacity .3s ease,transform .3s ease;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.96);}

/* ── MENU ── */
#menuScreen{background:var(--bg);}
.menu-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.menu-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,rgba(0,229,255,.08),transparent 55%),radial-gradient(ellipse at 75% 70%,rgba(255,45,107,.07),transparent 55%);}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite var(--dl);}
@keyframes twinkle{0%,100%{opacity:.12;}50%{opacity:.65;}}
.menu-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px;padding:30px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:100vh;touch-action:pan-y;}
.menu-logo h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,6vw,3rem);font-weight:900;background:linear-gradient(120deg,var(--accent),var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;line-height:1.1;text-align:center;}
.menu-logo p{font-size:.75rem;letter-spacing:3px;color:rgba(255,255,255,.3);margin-top:5px;text-transform:uppercase;text-align:center;}
.menu-preview{display:flex;gap:6px;}
.prev-block{width:26px;height:26px;border-radius:5px;border-top:2px solid rgba(255,255,255,.28);animation:float var(--fd) ease-in-out infinite var(--dl);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.menu-stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.stat-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 13px;}
.stat-pill .icon{font-size:.95rem;}
.stat-pill .val{font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:700;}
.stat-pill .lbl{font-size:.55rem;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;}
.menu-btns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:270px;}
.mbtn{width:100%;padding:14px 0;border:none;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .18s,box-shadow .18s;will-change:transform;}
.mbtn:active{transform:scale(.97)!important;}
.mbtn.primary{background:linear-gradient(120deg,var(--accent),#0070ff);color:#fff;box-shadow:0 0 28px rgba(0,229,255,.22);}
.mbtn.primary:hover{transform:scale(1.03);box-shadow:0 0 38px rgba(0,229,255,.4);}
.mbtn.shop-btn{background:linear-gradient(120deg,var(--gold),#ff8c00);color:#000;}
.mbtn.shop-btn:hover{transform:scale(1.03);box-shadow:0 0 28px rgba(255,208,0,.35);}

/* ── SHOP ── */
#shopScreen{background:var(--bg);padding:0 14px;justify-content:flex-start;}
.shop-header{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;flex-shrink:0;}
.shop-title{font-family:'Orbitron',sans-serif;font-size:1.15rem;font-weight:900;background:linear-gradient(120deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
.shop-top-right{display:flex;align-items:center;gap:8px;}
.coin-disp{display:flex;align-items:center;gap:6px;background:rgba(255,208,0,.1);border:1px solid rgba(255,208,0,.28);border-radius:18px;padding:5px 14px;}
.coin-disp span{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:var(--gold);}
.back-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:6px 13px;color:rgba(255,255,255,.65);font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:background .18s;}
.back-btn:hover{background:rgba(255,255,255,.13);}
.shop-items{width:100%;max-width:420px;display:flex;flex-direction:column;gap:11px;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(100vh - 80px);padding-bottom:20px;touch-action:pan-y;}
.shop-item{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:14px;display:flex;align-items:center;gap:13px;transition:border-color .18s,box-shadow .18s;}
.shop-item:hover{border-color:rgba(255,208,0,.28);box-shadow:0 0 18px rgba(255,208,0,.06);}
.item-icon{font-size:1.8rem;flex-shrink:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-radius:11px;}
.item-info{flex:1;min-width:0;}
.item-name{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.5px;margin-bottom:3px;}
.item-desc{font-size:.72rem;color:rgba(255,255,255,.42);line-height:1.35;}
.item-owned{font-size:.65rem;color:var(--green);letter-spacing:.5px;margin-top:3px;}
.buy-btn{flex-shrink:0;padding:8px 13px;border:none;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(120deg,var(--gold),#ff8c00);color:#000;}
.buy-btn:hover{box-shadow:0 0 16px rgba(255,208,0,.45);transform:scale(1.04);}
.buy-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
.buy-price{font-size:.7rem;}

/* ── GAME HUD ── */
#gameScreen{justify-content:flex-start;}
#header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(0,229,255,.1);background:rgba(0,0,0,.35);flex-shrink:0;}
.logo-small{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:900;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.hud{display:flex;gap:7px;align-items:center;}
.hud-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:4px 9px;}
.hud-pill .hv{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;}
#hintBtn{padding:4px 10px;background:rgba(255,208,0,.1);border:1px solid rgba(255,208,0,.28);border-radius:6px;color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.55rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .18s;white-space:nowrap;}
#hintBtn:hover{background:rgba(255,208,0,.2);}
#hintBtn:disabled{opacity:.28;cursor:not-allowed;}
.menu-icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 8px;color:rgba(255,255,255,.55);font-size:.85rem;cursor:pointer;transition:background .18s;}
.menu-icon-btn:hover{background:rgba(255,255,255,.12);}

/* ── GRID ── */
#layout{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:calc(100vh - 44px);padding:8px 10px 12px;gap:6px;}
#gridWrap{perspective:700px;perspective-origin:50% 10%;flex-shrink:0;}
#gridTilt{transform:rotateX(18deg);transform-style:preserve-3d;will-change:transform;}
#grid{display:grid;grid-template-columns:repeat(8,var(--cs));grid-template-rows:repeat(8,var(--cs));gap:2px;background:rgba(0,229,255,.05);padding:4px;border-radius:8px;border:1px solid rgba(0,229,255,.1);}
.cell{width:var(--cs);height:var(--cs);background:var(--cell);border-radius:4px;border:1px solid rgba(255,255,255,.04);position:relative;will-change:transform;}
.cell::before{content:'';position:absolute;inset:0;border-radius:4px;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 55%);pointer-events:none;}
.cell.filled{border-color:rgba(255,255,255,.11);box-shadow:0 2px 5px rgba(0,0,0,.35);}
.cell.filled::after{content:'';position:absolute;top:0;left:0;right:0;height:34%;border-radius:4px 4px 0 0;background:rgba(255,255,255,.2);pointer-events:none;}
.cell.ghost{border-color:rgba(255,255,255,.48)!important;transition:background .05s;}
.cell.bad-ghost{background:rgba(255,0,60,.28)!important;border-color:rgba(255,0,60,.55)!important;}
@keyframes hintPulse{0%,100%{box-shadow:0 0 5px rgba(255,208,0,.35);}50%{box-shadow:0 0 16px rgba(255,208,0,.85);}}
.cell.hint-cell{border-color:rgba(255,208,0,.65)!important;animation:hintPulse .9s ease-in-out infinite;}

/* Clear animations - staggered for smoothness */
@keyframes clearPop{
  0%  {opacity:1;transform:scale(1);filter:brightness(1);}
  35% {opacity:1;transform:scale(1.18);filter:brightness(2.8);}
  100%{opacity:0;transform:scale(0) translateY(-10px);filter:brightness(4);}
}
.cell.clearing{animation:clearPop .42s cubic-bezier(.4,0,.2,1) forwards;}

/* ── COMBO DISPLAY ── */
#comboWrap{height:40px;display:flex;align-items:center;justify-content:center;position:relative;}
#comboTxt{
  font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:3px;
  text-align:center;opacity:0;transform:scale(.7);
  transition:opacity .22s ease,transform .22s cubic-bezier(.175,.885,.32,1.275);
  pointer-events:none;
}
#comboTxt.show{opacity:1;transform:scale(1);}
/* Combo level colors */
#comboTxt.c2{color:#ffd000;font-size:.85rem;text-shadow:0 0 12px rgba(255,208,0,.5);}
#comboTxt.c3{color:#fb5607;font-size:1rem;text-shadow:0 0 16px rgba(251,86,7,.6);}
#comboTxt.c4{color:#ff2d6b;font-size:1.1rem;text-shadow:0 0 20px rgba(255,45,107,.7);}
#comboTxt.c5{color:#a855f7;font-size:1.2rem;text-shadow:0 0 24px rgba(168,85,247,.8);}
#comboTxt.cmax{color:#00e5ff;font-size:1.35rem;text-shadow:0 0 30px rgba(0,229,255,1);animation:maxCombo .6s ease infinite alternate;}
@keyframes maxCombo{from{letter-spacing:2px;}to{letter-spacing:5px;}}

/* ── TRAY ── */
#tray{display:flex;gap:10px;justify-content:center;align-items:center;width:100%;flex-shrink:0;}
.piece-slot{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center;min-width:54px;min-height:54px;cursor:grab;transition:transform .15s,border-color .15s,box-shadow .15s;will-change:transform;}
.piece-slot:hover{border-color:rgba(255,255,255,.18);transform:scale(1.06);}
.piece-slot:active{cursor:grabbing;}
.piece-slot.gone{opacity:.14;pointer-events:none;}
.piece-slot.hint-selected{border-color:rgba(255,208,0,.55)!important;box-shadow:0 0 11px rgba(255,208,0,.28);}
.pg{display:grid;gap:2px;}
.mc{width:17px;height:17px;border-radius:3px;position:relative;}
.mc.f{border:1px solid rgba(255,255,255,.17);}
.mc.f::after{content:'';position:absolute;top:0;left:0;right:0;height:37%;border-radius:3px 3px 0 0;background:rgba(255,255,255,.2);}
.mc.e{background:transparent!important;}

/* ── DRAG CLONE ── */
#clone{position:fixed;pointer-events:none;z-index:9999;display:none;opacity:.8;will-change:left,top;}
#clone .pg{filter:drop-shadow(0 0 9px rgba(255,255,255,.32));}

/* ── PARTICLES CANVAS ── */
#pfx{position:fixed;inset:0;pointer-events:none;z-index:400;}

/* ── SCORE / COIN POPUPS ── */
@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(1.45);}}
.spop{position:fixed;font-family:'Orbitron',sans-serif;font-weight:900;pointer-events:none;z-index:500;animation:floatUp .8s ease forwards;}
@keyframes coinFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-44px);}}
.cpop{position:fixed;font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:700;color:var(--gold);pointer-events:none;z-index:500;text-shadow:0 0 8px var(--gold);animation:coinFloat 1.1s ease forwards;}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(7px);}
.modal-overlay.show{display:flex;}
.modal-box{text-align:center;padding:32px 40px;background:var(--surface);border:1px solid rgba(0,229,255,.22);border-radius:16px;box-shadow:0 0 50px rgba(0,229,255,.07);display:flex;flex-direction:column;gap:12px;min-width:270px;}
.modal-title{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.modal-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);border-radius:9px;padding:9px 13px;}
.modal-row .lbl{font-size:.7rem;letter-spacing:1px;color:rgba(255,255,255,.4);text-transform:uppercase;}
.modal-row .val{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;}
.modal-row .val.gold{color:var(--gold);}
.modal-btns{display:flex;flex-direction:column;gap:7px;}
.gbtn{padding:10px 0;border:none;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:transform .18s,box-shadow .18s;width:100%;}
.gbtn:hover{transform:scale(1.03);}
.gbtn:active{transform:scale(.97);}
.gbtn.primary{background:linear-gradient(120deg,var(--accent),#0070ff);color:#fff;}
.gbtn.secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.65);}
.gbtn.shop-go{background:linear-gradient(120deg,var(--gold),#ff8c00);color:#000;}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(15,15,30,.92);border:1px solid rgba(255,208,0,.28);border-radius:7px;padding:7px 16px;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.8px;color:var(--gold);z-index:800;opacity:0;transition:opacity .28s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}

/* Screen-flash for big combos */
#flash{position:fixed;inset:0;pointer-events:none;z-index:350;opacity:0;transition:opacity .08s;}
</style>
</head>
<body>

<!-- PARTICLE CANVAS -->
<canvas id="pfx"></canvas>
<!-- FLASH -->
<div id="flash"></div>

<!-- ══ MENU ══ -->
<div id="menuScreen" class="screen">
  <div class="menu-bg" id="menuBg"></div>
  <div class="menu-inner">
    <div class="menu-logo"><h1>BLOCK BLAST</h1><p>3D Edition</p></div>
    <div class="menu-preview" id="menuPreview"></div>
    <div class="menu-stats">
      <div class="stat-pill"><span class="icon">🏆</span><div><div class="val" id="menuBest">0</div><div class="lbl">En İyi</div></div></div>
      <div class="stat-pill"><span class="icon">💰</span><div><div class="val" id="menuCoins">0</div><div class="lbl">Coin</div></div></div>
      <div class="stat-pill"><span class="icon">💡</span><div><div class="val" id="menuHints">3</div><div class="lbl">İpucu</div></div></div>
    </div>
    <div class="menu-btns">
      <button class="mbtn primary" onclick="goGame()">▶ OYNA</button>
      <button class="mbtn shop-btn" onclick="goShop()">🛒 MAĞAZA</button>
    </div>
  </div>
</div>

<!-- ══ SHOP ══ -->
<div id="shopScreen" class="screen hidden">
  <div class="shop-header">
    <div class="shop-title">🛒 MAĞAZA</div>
    <div class="shop-top-right">
      <div class="coin-disp">💰 <span id="shopCoins">0</span></div>
      <button class="back-btn" onclick="goMenu()">← GERİ</button>
    </div>
  </div>
  <div class="shop-items" id="shopItems"></div>
</div>

<!-- ══ GAME ══ -->
<div id="gameScreen" class="screen hidden">
  <div id="header">
    <div class="logo-small">BB3D</div>
    <div class="hud">
      <div class="hud-pill">💰 <span class="hv" id="hudCoins">0</span></div>
      <div class="hud-pill">⭐ <span class="hv" id="hudScore">0</span></div>
      <button id="hintBtn" onclick="showHint()">💡 <span id="hintCount">3</span></button>
      <button class="menu-icon-btn" onclick="pauseGame()">⏸</button>
    </div>
  </div>
  <div id="layout">
    <div id="gridWrap"><div id="gridTilt"><div id="grid"></div></div></div>
    <div id="comboWrap"><div id="comboTxt"></div></div>
    <div id="tray"></div>
  </div>
</div>

<!-- DRAG CLONE -->
<div id="clone"><div class="pg" id="cloneGrid"></div></div>

<!-- PAUSE -->
<div class="modal-overlay" id="pauseModal">
  <div class="modal-box">
    <div class="modal-title">DURAKLAT</div>
    <div class="modal-row"><span class="lbl">Skor</span><span class="val" id="pauseScore">0</span></div>
    <div class="modal-row"><span class="lbl">Coin</span><span class="val gold" id="pauseCoins">0</span></div>
    <div class="modal-btns">
      <button class="gbtn primary" onclick="resumeGame()">▶ DEVAM</button>
      <button class="gbtn shop-go" onclick="pauseToShop()">🛒 MAĞAZA</button>
      <button class="gbtn secondary" onclick="goMenuFromGame()">🏠 ANA MENÜ</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="modal-overlay" id="overModal">
  <div class="modal-box">
    <div class="modal-title">OYUN BİTTİ</div>
    <div class="modal-row"><span class="lbl">Skor</span><span class="val" id="overScore">0</span></div>
    <div class="modal-row"><span class="lbl">Kazanılan Coin</span><span class="val gold" id="overCoins">+0</span></div>
    <div class="modal-row"><span class="lbl">En İyi</span><span class="val" id="overBest">0</span></div>
    <div class="modal-btns">
      <button class="gbtn primary" onclick="restartGame()">↺ TEKRAR</button>
      <button class="gbtn shop-go" onclick="overToShop()">🛒 MAĞAZA</button>
      <button class="gbtn secondary" onclick="goMenuFromGame()">🏠 ANA MENÜ</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ===========================================
   AUDIO ENGINE  (Web Audio API - zero files)
=========================================== */
let AC=null;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}

/* Low-level tone builder */
function tone(ac, freq, type, startT, dur, vol, freqEnd){
  const o=ac.createOscillator(), g=ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type=type;
  o.frequency.setValueAtTime(freq, startT);
  if(freqEnd!=null) o.frequency.linearRampToValueAtTime(freqEnd, startT+dur);
  g.gain.setValueAtTime(0, startT);
  g.gain.linearRampToValueAtTime(vol, startT+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, startT+dur);
  o.start(startT); o.stop(startT+dur+0.05);
}

/* Noise burst (for impacts) */
function noise(ac, startT, dur, vol){
  const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src=ac.createBufferSource();
  const g=ac.createGain();
  const f=ac.createBiquadFilter();
  src.buffer=buf; f.type='bandpass'; f.frequency.value=300; f.Q.value=1;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(vol,startT);
  g.gain.exponentialRampToValueAtTime(0.0001,startT+dur);
  src.start(startT); src.stop(startT+dur+0.05);
}

/* -- DRAG HOVER sound: subtle tick when hovering new cell -- */
let dragLastTick=0;
function playDragTick(){
  try{
    const ac=getAC(), now=ac.currentTime;
    if(now-dragLastTick<0.04) return; // throttle: max ~25/sec
    dragLastTick=now;
    tone(ac,1200,'sine',now,.025,.035);
  }catch(e){}
}

/* -- PICK UP (mousedown on piece) -- */
function playPickup(){
  try{
    const ac=getAC(), t=ac.currentTime;
    tone(ac,440,'sine',t,.06,.13);
    tone(ac,660,'sine',t+.03,.05,.09);
  }catch(e){}
}

/* -- PLACE (drop on grid) -- */
function playPlace(){
  try{
    const ac=getAC(), t=ac.currentTime;
    noise(ac,t,.055,.18);
    tone(ac,200,'sine',t,.09,.14);
    tone(ac,140,'triangle',t+.02,.07,.1);

/* -- COMBO SOUNDS: each level has a completely unique signature --
   combo 2  -> double beep (happy)
   combo 3  -> triple ascending notes
   combo 4  -> fanfare chord
   combo 5  -> power chord + sub bass
   combo 6  -> laser sweep up
   combo 7  -> church bell overtones
   combo 8  -> dramatic cymbal swell
   combo 9+ -> full epic arpeggio burst
*/
function playCombo(level){
  try{
    const ac=getAC(), t=ac.currentTime;
    if(level===2){
      // Double beep - cheerful
      tone(ac,660,'sine',t,.1,.15);
      tone(ac,880,'sine',t+.11,.12,.15);
    } else if(level===3){
      // Triple ascending
      tone(ac,523,'triangle',t,.1,.15);
      tone(ac,659,'triangle',t+.1,.1,.15);
      tone(ac,784,'triangle',t+.2,.14,.18);
    } else if(level===4){
      // Fanfare chord
      tone(ac,523,'sawtooth',t,.22,.1);
      tone(ac,659,'sawtooth',t,.22,.09);
      tone(ac,784,'sawtooth',t,.22,.09);
      tone(ac,1047,'sine',t+.05,.2,.12);
    } else if(level===5){
      // Power chord + punchy sub
      tone(ac,110,'sawtooth',t,.15,.18);
      tone(ac,220,'sawtooth',t,.15,.14);
      tone(ac,440,'sawtooth',t,.15,.12);
      tone(ac,880,'sine',t+.04,.18,.1);
      noise(ac,t,.08,.22);
    } else if(level===6){
      // Laser sweep upward
      tone(ac,200,'sawtooth',t,.25,.14,1800);
      tone(ac,300,'sine',t+.06,.2,.1,2400);
      tone(ac,1200,'sine',t+.2,.15,.12);
      noise(ac,t+.22,.05,.14);
    } else if(level===7){
      // Bell overtones (church bell feel)
      const bell=[523,1047,1568,2093];
      bell.forEach((f,i)=>{
        tone(ac,f,'sine',t+i*0.04, 0.35-i*0.04, 0.14-i*0.02);
      });
      tone(ac,130,'sine',t,.3,.18);
    } else if(level===8){
      // Cymbal swell + dramatic chord
      noise(ac,t,.3,.25);
      tone(ac,196,'sawtooth',t,.35,.16);
      tone(ac,294,'sawtooth',t+.04,.3,.14);
      tone(ac,392,'sawtooth',t+.08,.28,.12);
      tone(ac,784,'sine',t+.1,.25,.1);
      tone(ac,1568,'sine',t+.15,.2,.08);
    } else {
      // level 9+ - epic full arpeggio burst
      const epic=[261,329,392,523,659,784,1047,1319,1568];
      const n=Math.min(level+1,epic.length);
      for(let i=0;i<n;i++) tone(ac,epic[i],'sawtooth',t+i*.04,.22,.12);
      // bass hit
      tone(ac,65,'sine',t,.3,.22);
      tone(ac,98,'sine',t+.03,.28,.18);
      noise(ac,t,.12,.2);
      // final sparkle
      tone(ac,2637,'sine',t+n*.04,.18,.08);
    }
  }catch(e){}
}

/* ===========================================
   PARTICLE SYSTEM (canvas, pooled)
=========================================== */
const pfxCanvas=document.getElementById('pfx');
const pfxCtx=pfxCanvas.getContext('2d');
let particles=[];
let pfxRAF=null;

function resizePfx(){pfxCanvas.width=window.innerWidth;pfxCanvas.height=window.innerHeight;}
resizePfx();
window.addEventListener('resize',resizePfx,{passive:true});

function spawnParticles(x,y,color,count=10){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1.5+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-2,
      r:2+Math.random()*3,
      color,
      life:1,
      decay:.025+Math.random()*.03
    });
  }
  if(!pfxRAF) pfxLoop();
}

function pfxLoop(){
  pfxCtx.clearRect(0,0,pfxCanvas.width,pfxCanvas.height);
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.12;
    p.vx*=.97; p.life-=p.decay;
    if(p.life<=0)return false;
    pfxCtx.globalAlpha=p.life;
    pfxCtx.fillStyle=p.color;
    pfxCtx.beginPath();
    pfxCtx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    pfxCtx.fill();
    return true;
  });
  pfxCtx.globalAlpha=1;
  if(particles.length>0)pfxRAF=requestAnimationFrame(pfxLoop);
  else pfxRAF=null;
}

function burstLine(cells,color){
  // Spawn particles at each cell's screen position
  cells.forEach(([r,c])=>{
    const el=document.getElementById(`B${r}_${c}`);
    if(!el)return;
    const rect=el.getBoundingClientRect();
    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height/2;
    spawnParticles(x,y,color,8);
  });
}

function makePG(p,sz){
  const maxR=Math.max(...p.c.map(([r])=>r));
  const maxC=Math.max(...p.c.map(([,c])=>c));
  const pg=document.createElement('div');pg.className='pg';
  pg.style.gridTemplateRows=`repeat(${maxR+1},${sz}px)`;
  pg.style.gridTemplateColumns=`repeat(${maxC+1},${sz}px)`;
  const frag=document.createDocumentFragment();
  for(let r=0;r<=maxR;r++)for(let c=0;c<=maxC;c++){
    const f=p.c.some(([pr,pc])=>pr===r&&pc===c);
    const mc=document.createElement('div');
    mc.className='mc '+(f?'f':'e');

/* -- HINT -- */
function showHint(){
  if(!save.infiniteHintGame&&hintLeft<=0)return;
  clearHintUI();
  let bs=-Infinity,bPi=null,bR=null,bC=null;
  pieces.forEach((p,pi)=>{
    if(!p)return;
    for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){
      if(!canPlace(p,r,c))continue;
      const s=heuristic(p,r,c);
      if(s>bs){bs=s;bPi=pi;bR=r;bC=c;}
    }
  });
  if(bPi===null){showToast('Hiç yer yok!',1800);return;}
  if(!save.infiniteHintGame){hintLeft--;save.hints=Math.max(0,save.hints-1);writeSave();}
  updateHUD();playHint();
  const slot=document.getElementById(`PS${bPi}`);
  if(slot)slot.classList.add('hint-selected');
  pieces[bPi].c.forEach(([dr,dc])=>{
    const el=document.getElementById(`B${bR+dr}_${bC+dc}`);
    if(el)el.classList.add('hint-cell');
  });
  showToast('💡 Parlayan bloğu, parlayan hücreye koy!',2400);
  hintTO=setTimeout(()=>clearHintUI(),4500);
}
function heuristic(p,sr,sc){
  let tb=board.map(r=>[...r]);
  p.c.forEach(([dr,dc])=>{tb[sr+dr][sc+dc]=p.col;});
  const ar=[...new Set(p.c.map(([dr])=>sr+dr))];
  const ac=[...new Set(p.c.map(([,dc])=>sc+dc))];
  const cr=ar.filter(r=>tb[r].every(v=>v)).length;
  const cc=ac.filter(c=>tb.every(row=>row[c])).length;
  let nb=0;
  p.c.forEach(([dr,dc])=>{
    [[sr+dr-1,sc+dc],[sr+dr+1,sc+dc],[sr+dr,sc+dc-1],[sr+dr,sc+dc+1]].forEach(([nr,nc])=>{
      if(nr>=0&&nr<GS&&nc>=0&&nc<GS&&board[nr][nc])nb++;
    });
  });
  return (cr+cc)*1000+nb*10+p.c.length;
}
function clearHintUI(){
  if(hintTO){clearTimeout(hintTO);hintTO=null;}
  document.querySelectorAll('.hint-cell').forEach(el=>el.classList.remove('hint-cell'));
  document.querySelectorAll('.hint-selected').forEach(el=>el.classList.remove('hint-selected'));
}

function startDrag(e,idx,isTouch){

  if(!pieces[idx])return;
  clearHintUI();
  dIdx=idx;dPiece=pieces[idx];dragging=true;
  const pt=isTouch?e.touches[0]:e;
  const rect=e.currentTarget.getBoundingClientRect();
  offX=pt.clientX-rect.left;offY=pt.clientY-rect.top;
  const cg=document.getElementById('cloneGrid');
  cg.innerHTML='';cg.appendChild(makePG(dPiece,20));
  document.getElementById('clone').style.display='block';
  moveClone(pt.clientX,pt.clientY);
  gridRect=document.getElementById('grid').getBoundingClientRect();
  document.getElementById(`PS${idx}`).style.opacity='.18';
  playPickup();
}
function moveClone(cx,cy){
  const cl=document.getElementById('clone');
  cl.style.left=(cx-offX)+'px';cl.style.top=(cy-offY)+'px';
}
function screenToCell(cx,cy){
  if(!gridRect)return null;
  const cosA=Math.cos(18*Math.PI/180);
  const gx=(cx-gridRect.left)-PAD;
  const relY=cy-(gridRect.top+gridRect.height/2);
  const gy=(relY/cosA)+gridRect.height/2-PAD;
  const step=CS+GAP;
  const c=Math.floor(gx/step),r=Math.floor(gy/step);
  if(r<0||r>=GS||c<0||c>=GS)return null;
  return{r,c};
}
function showGhost(r,c){
  clearGhost();
  if(!dPiece)return;
  const ok=canPlace(dPiece,r,c);
  dPiece.c.forEach(([dr,dc])=>{
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=GS||nc<0||nc>=GS)return;
    const el=document.getElementById(`B${nr}_${nc}`);if(!el)return;
    if(ok){el.classList.add('ghost');el.style.background=hexRgba(dPiece.col,.38);}
    else el.classList.add('ghost','bad-ghost');
  });
}
function clearGhost(){
  document.querySelectorAll('.cell.ghost').forEach(el=>{
    el.classList.remove('ghost','bad-ghost');
    const[r,c]=el.id.slice(1).split('_').map(Number);
    el.style.background=board[r][c]||'';
  });
}
function canPlace(p,sr,sc){
  return p.c.every(([dr,dc])=>{const r=sr+dr,c=sc+dc;return r>=0&&r<GS&&c>=0&&c<GS&&!board[r][c];});
}
function hexRgba(hex,a){
  return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}

function onMove(cx,cy){
  if(!dragging)return;
  moveClone(cx,cy);
  const cell=screenToCell(cx,cy);
  if(cell){
    if(cell.r!==lastR||cell.c!==lastC){
      lastR=cell.r;lastC=cell.c;
      showGhost(cell.r,cell.c);
      playDragTick();
    }
  } else{clearGhost();lastR=null;lastC=null;}
}
function onUp(cx,cy){
  if(!dragging)return;
  const cell=screenToCell(cx,cy);
  clearGhost();
  if(cell&&dPiece&&canPlace(dPiece,cell.r,cell.c))place(dPiece,cell.r,cell.c,dIdx);
  endDrag();
}
function endDrag(){
  dragging=false;
  document.getElementById('clone').style.display='none';
  lastR=null;lastC=null;
  if(dIdx!=null){const el=document.getElementById(`PS${dIdx}`);if(el)el.style.opacity='';}
  dPiece=null;dIdx=null;gridRect=null;
}

document.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
document.addEventListener('mouseup',e=>onUp(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>{
  const shop=document.getElementById('shopScreen');
  const menu=document.getElementById('menuScreen');
  if(!shop.classList.contains('hidden')||!menu.classList.contains('hidden'))return;
  e.preventDefault();const t=e.touches[0];onMove(t.clientX,t.clientY);
},{passive:false});
document.addEventListener('touchend',e=>{const t=e.changedTouches[0];onUp(t.clientX,t.clientY);});

/* -- PLACE -- */
function place(p,sr,sc,idx){
  p.c.forEach(([dr,dc])=>{board[sr+dr][sc+dc]=p.col;refreshCell(sr+dr,sc+dc);});
  pieces[idx]=null;
  renderTray();
  playPlace();

  const rows=[...new Set(p.c.map(([dr])=>sr+dr))].filter(r=>board[r].every(v=>v));
  const cols=[...new Set(p.c.map(([,dc])=>sc+dc))].filter(c=>board.every(row=>row[c]));

  if(rows.length+cols.length>0){
    // Stagger clearing animation per cell for smoothness
    const keySet=new Set();
    rows.forEach(r=>{for(let c=0;c<GS;c++)keySet.add(`${r}_${c}`);});
    cols.forEach(c=>{for(let r=0;r<GS;r++)keySet.add(`${r}_${c}`);});
    const keys=[...keySet];
    // Stagger by column for a wave effect
    keys.sort((a,b)=>{
      const ca=parseInt(a.split('_')[1]);
      const cb=parseInt(b.split('_')[1]);
      return ca-cb;
    });
    keys.forEach((k,i)=>{
      const el=document.getElementById('B'+k);
      if(el){
        el.style.animationDelay=(i*12)+'ms';
        el.classList.add('clearing');
      }
    });

    setTimeout(()=>{
      // Burst particles at clear cells
      const sampleColor=board[rows[0]||0][0]||p.col;
      keys.slice(0,16).forEach(k=>{
        const[r,c]=k.split('_').map(Number);
        const el=document.getElementById(`B${r}_${c}`);
        if(el){const rect=el.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,board[r][c]||sampleColor,7);}
      });

      rows.forEach(r=>{board[r]=Array(GS).fill(null);});
      cols.forEach(c=>{for(let r=0;r<GS;r++)board[r][c]=null;});
      const lines=rows.length+cols.length;
      const pts=lines*100*combo;
      score+=pts;
      if(score>save.best)save.best=score;

      const multi=save.doubleCoin?2:1;
      const earned=Math.floor(pts/10)*multi;
      save.coins+=earned;gameCoinsEarned+=earned;writeSave();

      combo++;

      // Sound & visual effects based on combo
      playClear(lines);
      // Always play combo sound (x2 onwards has unique sound)
      setTimeout(()=>playCombo(combo), lines*55+70);
      if(combo>=2){
        showComboUI(combo);
        if(combo>=4) screenFlash(`rgba(${combo>=6?'168,85,247':combo>=5?'255,45,107':'255,208,0'},.18)`,300);
      }

      showScorePopup(pts,earned);
      updateHUD();
      renderBoard();
      // Reset animation delays
      document.querySelectorAll('.cell').forEach(el=>el.style.animationDelay='');
      afterPlace();
    },420);
  } else {
    // No clear - reset combo
    combo=1;
    const earned=p.c.length*(save.doubleCoin?2:1);
    save.coins+=earned;gameCoinsEarned+=earned;writeSave();
    showCoinPop(earned);
    updateHUD();
    afterPlace();
  }
}

function afterPlace(){
  if(pieces.every(p=>p===null)){
    pieces=[rnd(),rnd(),rnd()];
    renderTray();
  }
  if(!anyFit())setTimeout(gameOver,360);
}
function anyFit(){
  return pieces.some(p=>{
    if(!p)return false;
    for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(canPlace(p,r,c))return true;
    return false;
  });
}
function gameOver(){
  if(save.infiniteHintGame)save.infiniteHintGame=false;
  if(save.doubleCoin)save.doubleCoin=false;
  writeSave();playGameOver();
  document.getElementById('overScore').textContent=score;
  document.getElementById('overCoins').textContent=`+${gameCoinsEarned} 💰`;
  document.getElementById('overBest').textContent=save.best;
  document.getElementById('overModal').classList.add('show');
}

function showScorePopup(pts,coins){
  const el=document.createElement('div');
  el.className='spop';
  el.style.cssText=`left:50%;top:36%;color:#ffd000;font-size:${pts>=400?'1.4rem':'1.1rem'};text-shadow:0 0 14px #ffd000;`;
  el.textContent=`+${pts}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
  if(coins>0)showCoinPop(coins);
}
function showCoinPop(coins){
  const el=document.createElement('div');
  el.className='cpop';
  el.style.cssText=`left:${28+Math.random()*44}%;top:44%;`;
  el.textContent=`+${coins}💰`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

let toastTO=null;
function showToast(msg,dur=2000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastTO)clearTimeout(toastTO);
  toastTO=setTimeout(()=>t.classList.remove('show'),dur);
}

window.addEventListener('resize',()=>{calcCS();renderBoard();renderTray();},{passive:true});

/* -- BOOT -- */
buildStars();buildPreview();updateMenuStats();
// Welcome jingle on first load
setTimeout(()=>playMenuOpen(), 400);
showScreen('menuScreen');
</script>
